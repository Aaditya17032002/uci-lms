name: Build and deploy React app to Azure Web App - ucitms3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build React app
        run: |
          npm ci --force
          npm run build
          echo "✅ Build completed. Contents:"
          ls -la build

      - name: Upload build folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: Verify downloaded build
        run: |
          echo "📦 Downloaded build contents:"
          ls -la build

      - name: Add static web config (disable npm start)
        run: |
          echo "🛠️ Creating web.config to serve static React app..."
          cat > build/web.config << 'EOF'
          <configuration>
            <system.webServer>
              <handlers>
                <add name="StaticFile" path="*" verb="*" modules="StaticFileModule" resourceType="Either" requireAccess="Read" />
              </handlers>
              <rewrite>
                <rules>
                  <rule name="ReactRouter" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ucitms3'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_77136B92C16749EA8C5DA997F59B5A28 }}
          package: build
